name: Encrypted macOS build and tests

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Task
        default: scene
        options: [scene, package, probes]
      platform:
        type: choice
        description: Architecture
        default: both
        options: [both, intel, arm64]

permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.platform == 'intel' && '["macos-15-intel"]' || inputs.platform == 'arm64' && '["macos-15"]' || '["macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      BUILD_PLATFORM: ${{ matrix.runner == 'macos-15' && 'macos-arm64' || 'macos-x64' }}
      BUILD_TARGET: ${{ matrix.runner == 'macos-15' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ env.BUILD_TARGET }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare encryption runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/runner-env"
          "$RUNNER_TEMP/runner-env/bin/pip" install cryptography==47.0.0
      - name: Execute private task
        env:
          ARCADIUM_BUILD_KEY: ${{ secrets.ARCADIUM_BUILD_KEY }}
        run: |
          "$RUNNER_TEMP/runner-env/bin/python" worker.py --platform '${{ env.BUILD_PLATFORM }}' --mode '${{ inputs.mode }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: encrypted-result-${{ env.BUILD_PLATFORM }}
          path: encrypted-output/*.enc
          if-no-files-found: error
          retention-days: 1
